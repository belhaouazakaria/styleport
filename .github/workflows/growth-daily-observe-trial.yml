name: SayTwist Phase14G One Daily OBSERVE Trial

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  daily-observe-trial:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.login == 'belhaouazakaria' &&
      github.event.comment.user.login == 'belhaouazakaria' &&
      startsWith(github.event.comment.body, 'RUN SAYTWIST GROWTH DAILY OBSERVE TRIAL ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: saytwist-phase14g-daily-observe-trial
      cancel-in-progress: false
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5

      - name: Validate exact-SHA owner authorization
        env:
          GROWTH_DAILY_OBSERVE_TRIAL_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/validate-growth-daily-observe-request.mjs

      - name: Reject advanced main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          test -f workers/growth-daily-observe-launch.cjs
          test -f workers/growth-daily-observe.ts

      - name: One approved daily OBSERVE account metadata GET
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          envs: EXPECTED_RELEASE
          script_stop: false
          command_timeout: 3m
          script: |
            set -eu
            test "$(id -un)" = "saytwist"
            cd /home/saytwist/htdocs/saytwist.com
            GROWTH_DAILY_OBSERVE_LAUNCH=true \
              GROWTH_DAILY_OBSERVE_MODE=TRIAL \
              /home/saytwist/.nvm/versions/node/v24.20.0/bin/node \
              workers/growth-daily-observe-launch.cjs
