name: Phase 14I isolated daily intelligence cycle E2E

on:
  pull_request:
    paths:
      - "workers/growth-autonomous-cycle.ts"
      - "workers/growth-autonomous-cycle-launch.cjs"
      - "workers/install-growth-autonomous-cycle-systemd.sh"
      - "tests/growth-autonomous-cycle-persistence.integration.test.ts"
      - ".github/workflows/growth-phase14i-cycle-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase14i-cycle-db:
    name: PostgreSQL 18 three-job cycle end-to-end qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: phase14i
          POSTGRES_PASSWORD: phase14i_disposable_ci_only
          POSTGRES_DB: saytwist_growth_phase14i_cycle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phase14i -d saytwist_growth_phase14i_cycle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://phase14i:phase14i_disposable_ci_only@127.0.0.1:5432/saytwist_growth_phase14i_cycle_test
      GROWTH_CYCLE_TEST_DATABASE_URL: postgresql://phase14i:phase14i_disposable_ci_only@127.0.0.1:5432/saytwist_growth_phase14i_cycle_test
      GROWTH_ATTRIBUTION_COLLECTION_ENABLED: "false"
      APP_BASE_URL: https://translators.example.com
      NEXTAUTH_URL: https://translators.example.com
      NEXTAUTH_SECRET: phase14i_ci_disposable_secret_not_for_production
      OPENAI_API_KEY: ci_only_no_network
      OPENAI_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - name: Apply all migrations to dedicated disposable PostgreSQL database
        run: node node_modules/prisma/build/index.js migrate deploy
      - name: Run complete local-only three-job cycle and same-day idempotence checks
        env:
          RUN_GROWTH_CYCLE_DB_TESTS: "1"
        run: npx vitest run tests/growth-autonomous-cycle-persistence.integration.test.ts
