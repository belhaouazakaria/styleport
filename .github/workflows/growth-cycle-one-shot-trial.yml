name: SayTwist Phase14I One-Shot Local Growth Cycle Trial

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  one-shot-growth-cycle:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.login == 'belhaouazakaria' &&
      github.event.comment.user.login == 'belhaouazakaria' &&
      startsWith(github.event.comment.body, 'RUN SAYTWIST GROWTH CYCLE TRIAL ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: saytwist-phase14i-one-shot-growth-cycle
      cancel-in-progress: false
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5
      - name: Validate exact owner, issue, comment and commit SHA
        env:
          GROWTH_CYCLE_TRIAL_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/validate-growth-cycle-trial-request.mjs
      - name: Refuse main advancing after owner approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          test -f workers/growth-autonomous-cycle.ts
          test -f workers/growth-autonomous-cycle-launch.cjs
      - name: Run one exact-SHA local-only cycle and validate fixed postconditions
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          envs: EXPECTED_RELEASE
          script_stop: true
          command_timeout: 12m
          script: |
            set -eu
            test "$(id -un)" = "saytwist"
            cd /home/saytwist/htdocs/saytwist.com
            test "$(cat .deployed-release)" = "$EXPECTED_RELEASE"
            test "$(systemctl is-active saytwist-growth-lease-watchdog.timer)" = "active"
            test "$(systemctl show -P Result saytwist-growth-lease-watchdog.service)" = "success"
            systemctl show -P Environment saytwist-growth-lease-watchdog.service |
              grep -Fq "WATCHDOG_EXPECTED_RELEASE_SHA=$EXPECTED_RELEASE"
            test "$(systemctl is-active saytwist-growth-daily-observe.timer)" = "active"
            test "$(systemctl show -P Result saytwist-growth-daily-observe.service)" = "success"
            EXPECTED_RELEASE="$EXPECTED_RELEASE" \
            GROWTH_AUTONOMOUS_CYCLE_LAUNCH=true \
            GROWTH_AUTONOMOUS_CYCLE_MODE=TRIAL \
            /home/saytwist/.nvm/versions/node/v24.20.0/bin/node \
              workers/growth-autonomous-cycle-launch.cjs
