name: SayTwist Phase14C One-Shot OBSERVE Qualification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  one-shot-observe:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.login == 'belhaouazakaria' &&
      github.event.comment.user.login == 'belhaouazakaria' &&
      startsWith(github.event.comment.body, 'RUN SAYTWIST GROWTH OBSERVE ONE SHOT ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: saytwist-phase14c-one-shot-observe
      cancel-in-progress: false
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5

      - name: Validate exact owner, issue, comment and commit SHA
        env:
          GROWTH_OBSERVE_TRIAL_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/validate-growth-observe-trial-request.mjs

      - name: Refuse advanced main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          test -f workers/growth-observe-trial.ts
          test -f workers/growth-lease-watchdog-launch.cjs

      - name: Qualify one local no-provider job and independently closed lease
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          envs: EXPECTED_RELEASE
          script_stop: false
          command_timeout: 3m
          script: |
            set -eu
            test "$(id -un)" = "saytwist"
            cd /home/saytwist/htdocs/saytwist.com
            /home/saytwist/.nvm/versions/node/v24.20.0/bin/node <<'NODE'
            const fs = require("node:fs");
            const { spawnSync } = require("node:child_process");
            const { validatedDatabaseUrl } =
              require("./workers/growth-lease-watchdog-launch.cjs");
            let stage = "RELEASE";
            try {
              const sha = process.env.EXPECTED_RELEASE || "";
              if (!/^[a-f0-9]{40}$/.test(sha) ||
                  fs.readFileSync(".deployed-release", "utf8").trim() !== sha) throw Error();
              stage = "WATCHDOG";
              const timer = "saytwist-growth-lease-watchdog.timer";
              const service = "saytwist-growth-lease-watchdog.service";
              const alert = "saytwist-growth-lease-watchdog-alert.service";
              const systemctl = (args) => spawnSync("/usr/bin/systemctl", args, {
                encoding: "utf8", timeout: 5000, maxBuffer: 4096,
              });
              if (systemctl(["is-active", "--quiet", timer]).status !== 0 ||
                  systemctl(["show", "-P", "Result", service]).stdout.trim() !== "success" ||
                  systemctl(["show", "-P", "OnFailure", service]).stdout.trim() !== alert) {
                throw Error();
              }
              stage = "PM2";
              const nodeDir = "/home/saytwist/.nvm/versions/node/v24.20.0/bin";
              const pm2 = "/home/saytwist/.npm/_npx/5f7878ce38f1eb13/node_modules/pm2/bin/pm2";
              const p = spawnSync(pm2, ["jlist"], {
                encoding: "utf8", timeout: 10000, maxBuffer: 16 * 1024 * 1024,
                env: { ...process.env, PM2_HOME: "/home/saytwist/.pm2",
                  PATH: nodeDir + ":/usr/local/bin:/usr/bin:/bin" },
              });
              if (p.status !== 0) throw Error();
              const rows = JSON.parse(p.stdout);
              const db = validatedDatabaseUrl(rows);
              const app = rows.find(row => row.name === "saytwist").pm2_env;
              const value = key => app[key] ?? app.env?.[key];
              for (const flag of [
                "GROWTH_WORKER_RUN_ENABLED", "GROWTH_DAILY_REPORT_SCHEDULE_ENABLED",
                "TELEGRAM_REPORTS_ENABLED", "GROWTH_ATTRIBUTION_COLLECTION_ENABLED",
              ]) if (value(flag) === "true") throw Error();
              if (["OBSERVE", "RECOMMEND"].includes(value("GROWTH_ROLLOUT_MODE"))) throw Error();
              stage = "ONE_SHOT";
              if (!fs.existsSync("workers/growth-observe-trial.ts") ||
                  !fs.existsSync("node_modules/tsx/dist/cli.mjs")) throw Error();
              const child = spawnSync(nodeDir + "/node",
                ["node_modules/tsx/dist/cli.mjs", "workers/growth-observe-trial.ts"], {
                  cwd: process.cwd(),
                  encoding: "utf8", timeout: 75000, maxBuffer: 8192,
                  env: {
                    NODE_ENV: "production", HOME: "/home/saytwist",
                    PATH: nodeDir + ":/usr/local/bin:/usr/bin:/bin", DATABASE_URL: db,
                    EXPECTED_RELEASE: sha,
                    GROWTH_OBSERVE_TRIAL_APPROVAL: "RUN SAYTWIST GROWTH OBSERVE ONE SHOT " + sha,
                    GROWTH_OBSERVE_TRIAL_ENTRYPOINT: "true",
                    GROWTH_WORKER_RUN_ENABLED: "false", GROWTH_ROLLOUT_MODE: "OFF",
                  },
                });
              const result = (child.stdout || "").trim();
              if (child.status !== 0 ||
                  result !== [
                    "GROWTH_OBSERVE_TRIAL=PASSED",
                    "GROWTH_OBSERVE_TRIAL_JOB=SUCCEEDED",
                    "GROWTH_OBSERVE_TRIAL_GROWTH=OFF",
                    "GROWTH_OBSERVE_TRIAL_LEASE=NONE",
                    "GROWTH_OBSERVE_TRIAL_ACTIVE_QUEUE=0",
                  ].join("\n")) throw Error();
              console.log(result);
              console.log("GROWTH_OBSERVE_TRIAL_PROVIDER_CALLS=0");
              console.log("GROWTH_OBSERVE_TRIAL_AI_CALLS=0");
              console.log("GROWTH_OBSERVE_TRIAL_PIN_PUBLICATIONS=0");
            } catch {
              // No PM2 environment, DB URL, credentials or child error detail in logs.
              console.error("PRODUCTION_OBSERVE_TRIAL=BLOCKED");
              console.error("PRODUCTION_OBSERVE_TRIAL_STAGE=" + stage);
              process.exitCode = 1;
            }
            NODE
