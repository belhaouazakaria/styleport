name: SayTwist Phase14K Cadence Populated-Clone Rehearsal

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  owner-approved-clone:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.login == 'belhaouazakaria' &&
      github.event.comment.user.login == 'belhaouazakaria' &&
      startsWith(github.event.comment.body, 'STAGE SAYTWIST PHASE14K CADENCE CLONE SOURCE ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: saytwist-phase14k-cadence-clone-stage
      cancel-in-progress: false
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@v5

      - name: Authorize owner issue, exact SHA, and clone identity
        env:
          PHASE14K_STAGE_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/authorize-growth-phase14k-cadence-stage.mjs

      - name: Refuse stale main and missing cadence source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          test -f prisma/migrations/20261105150000_growth_daily_cadence_controls/migration.sql
          test -f scripts/growth-phase14k-cadence-clone-rehearsal.cjs
          test -f scripts/growth-phase14k-verify-clone.cjs
          test -f scripts/hostinger-prepare-growth-cadence-migration.sh

      - name: Package immutable migration source only
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' "$GITHUB_SHA" > .release-sha
          tar -czf phase14k-cadence-source.tar.gz .release-sha prisma/schema.prisma prisma/migrations scripts/growth-phase14k-cadence-clone-rehearsal.cjs scripts/growth-phase14k-verify-clone.cjs scripts/hostinger-prepare-growth-cadence-migration.sh
          tar -tzf phase14k-cadence-source.tar.gz >/dev/null

      - name: Reserve exact-SHA private staging directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          script_stop: true
          command_timeout: 1m
          script: |
            set -eu
            test "$(id -un)" = "saytwist"
            umask 077
            ROOT=/home/saytwist/.local/share/saytwist/phase14k-rehearsal
            DIR="$ROOT/${{ github.sha }}"
            install -d -m 700 "$ROOT"
            test ! -e "$DIR"
            install -d -m 700 "$DIR"

      - name: Upload source archive to private staged directory
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          source: phase14k-cadence-source.tar.gz
          target: /home/saytwist/.local/share/saytwist/phase14k-rehearsal/${{ github.sha }}
          overwrite: false

      - name: Apply exactly one migration to fresh, populated CLONE only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          script_stop: true
          command_timeout: 7m
          script: |
            set -eu
            test "$(id -un)" = "saytwist"
            umask 077
            DIR=/home/saytwist/.local/share/saytwist/phase14k-rehearsal/${{ github.sha }}
            test -f "$DIR/phase14k-cadence-source.tar.gz"
            tar -tzf "$DIR/phase14k-cadence-source.tar.gz" >/dev/null
            tar -xzf "$DIR/phase14k-cadence-source.tar.gz" -C "$DIR"
            test "$(cat "$DIR/.release-sha")" = "${{ github.sha }}"
            cd "$DIR"
            GROWTH_PHASE14K_RELEASE_SHA="${{ github.sha }}" /home/saytwist/.nvm/versions/node/v24.20.0/bin/node scripts/growth-phase14k-cadence-clone-rehearsal.cjs
