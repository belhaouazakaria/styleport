name: SayTwist Growth Production Read-Only Preflight

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  production-preflight:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.login == 'belhaouazakaria' &&
      github.event.comment.user.login == 'belhaouazakaria' &&
      startsWith(github.event.comment.body, 'RUN SAYTWIST GROWTH READONLY PREFLIGHT ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: saytwist-growth-production-preflight
      cancel-in-progress: false
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5

      - name: Validate exact-SHA owner authorization
        env:
          GROWTH_PREFLIGHT_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/validate-growth-preflight-request.mjs

      - name: Verify main has not advanced
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"

      - name: Read-only production queue, account and runtime audit (no writes or secrets logged)
        uses: appleboy/ssh-action@v1.2.0
        env:
          PM2_CLI: ${{ secrets.HOSTINGER_PM2_CLI || vars.HOSTINGER_PM2_CLI }}
          EXPECTED_RELEASE: ${{ github.sha }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          # drone-ssh script_stop injects a shell check after every newline,
          # corrupting the quoted Node.js heredoc below. set -eu already
          # makes the remote script fail on a nonzero Node exit.
          script_stop: false
          command_timeout: 5m
          envs: PM2_CLI,EXPECTED_RELEASE
          script: |
            set -eu
            test "$(id -un)" = "saytwist"
            cd /home/saytwist/htdocs/saytwist.com
            /home/saytwist/.nvm/versions/node/v24.20.0/bin/node <<'NODE'
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const { PrismaClient } = require("@prisma/client");

            // Only predefined stages are emitted. Never log exception messages, PM2 JSON or credentials.
            let failureStage = "RELEASE_SHA";
            async function main() {
              const expected = process.env.EXPECTED_RELEASE || "";
              if (!/^[a-f0-9]{40}$/.test(expected) ||
                  fs.readFileSync(".deployed-release", "utf8").trim() !== expected) {
                throw Error("Deployed SHA differs from exact audit request.");
              }
              failureStage = "PM2_CLI";
              const nodeDir = "/home/saytwist/.nvm/versions/node/v24.20.0/bin";
              // Deploy uses HOSTINGER_PM2_CLI, but issue_comment workflows may not
              // have access to environment-scoped deployment variables. The first
              // fallback is the exact PM2 v7.0.4 binary confirmed by the guarded
              // Hostinger deploy log on 2026-10-29; NVM global bin is secondary.
              // Never search PATH or broaden GitHub production secret access.
              const verifiedPm2Cli =
                "/home/saytwist/.npm/_npx/5f7878ce38f1eb13/node_modules/pm2/bin/pm2";
              const fallbackPm2Cli = [verifiedPm2Cli, nodeDir + "/pm2"]
                .find(candidate => fs.existsSync(candidate));
              const pm2Cli = process.env.PM2_CLI || fallbackPm2Cli || "";
              if (!pm2Cli.startsWith("/") || !fs.existsSync(pm2Cli)) {
                throw Error("Existing PM2 CLI unavailable.");
              }
              fs.accessSync(pm2Cli, fs.constants.X_OK);
              failureStage = "PM2_SNAPSHOT";
              const apps = JSON.parse(execFileSync(pm2Cli, ["jlist"], {
                encoding: "utf8", timeout: 10000, maxBuffer: 16 * 1024 * 1024,
                env: {
                  ...process.env, PM2_HOME: "/home/saytwist/.pm2",
                  PATH: nodeDir + ":/usr/local/bin:/usr/bin:/bin",
                },
              }));
              failureStage = "PM2_APP_STATUS";
              const app = apps.find(x => x.name === "saytwist");
              if (!app || app.pm2_env?.status !== "online") throw Error("Application not online.");
              failureStage = "DB_TARGET";
              const env = app.pm2_env;
              const raw = env.DATABASE_URL || env.env?.DATABASE_URL;
              if (!raw) throw Error("Live database configuration unavailable.");
              const url = new URL(raw);
              if (!["postgres:", "postgresql:"].includes(url.protocol) ||
                  url.hostname !== "127.0.0.1" || url.port !== "5433" ||
                  decodeURIComponent(url.pathname.slice(1)) !== "saytwist" ||
                  url.searchParams.has("host")) {
                throw Error("Production database target mismatch.");
              }
              process.env.DATABASE_URL = raw;
              failureStage = "DB_READ";
              const db = new PrismaClient();
              try {
                const [settings, queued, accounts, heartbeat, reports, quotaHistory] = await Promise.all([
                  db.growthSettings.findUnique({ where: { id: "global" }, select: {
                    enabled: true, attributionEnabled: true, workerBatchSize: true,
                    aiDailyBudgetCents: true, aiMonthlyBudgetCents: true,
                    aiImagesPerDayCap: true, translatorCreatesPerDayCap: true,
                    translatorUpdatesPerDayCap: true, ideaCreatesPerWeekCap: true,
                  } }),
                  db.growthJob.groupBy({ by: ["type", "status"], _count: { _all: true } }),
                  db.growthPinterestAccount.findMany({ select: {
                    connectionStatus: true, apiEnvironment: true, encryptedCredentials: true,
                    accessTokenExpiresAt: true, refreshTokenExpiresAt: true,
                    grantedScopes: true, lastSuccessfulApiCallAt: true,
                  } }),
                  db.growthWorkerHeartbeat.findMany({ select: {
                    workerId: true, status: true, heartbeatAt: true, completedAt: true,
                  }, take: 8, orderBy: { heartbeatAt: "desc" } }),
                  db.growthDailyReport.findFirst({ select: { id: true, version: true },
                    orderBy: { reportDate: "desc" } }),
                  db.growthPinterestAnalyticsState.findMany({ select: {
                    lastRateLimitLimit: true, lastRateLimitRemaining: true,
                    lastRateLimitReset: true, rateLimitObservedAt: true,
                  }, orderBy: { rateLimitObservedAt: "desc" }, take: 4 }),
                ]);
                const flags = {};
                for (const name of [
                  "GROWTH_WORKER_RUN_ENABLED", "GROWTH_ROLLOUT_MODE",
                  "GROWTH_DAILY_REPORT_SCHEDULE_ENABLED", "TELEGRAM_REPORTS_ENABLED",
                  "GROWTH_ATTRIBUTION_COLLECTION_ENABLED",
                ]) {
                  // Never print the configured credential values.
                  const value = env[name] ?? env.env?.[name];
                  flags[name] = value === "true" ? "ON" :
                    (name === "GROWTH_ROLLOUT_MODE" ? (["OFF","OBSERVE","RECOMMEND"].includes(value) ? value : "OFF_OR_UNSUPPORTED") : "OFF");
                }
                const now = Date.now();
                // Character-class-only evidence. No original rate-limit value may
                // enter any report, even when a header is malformed or very long.
                function historicalHeaderEvidence(v) {
                  if (typeof v !== "string" || !v) return { kind: "ABSENT" };
                  let shape = "", previous = "";
                  for (const c of v.slice(0, 96)) {
                    const type = /[0-9]/.test(c) ? "N" :
                      /[A-Za-z]/.test(c) ? "A" :
                      c === " " || c === "\t" ? "S" :
                      /[,;=:._-]/.test(c) ? c : "X";
                    if (type === previous && ["N", "A", "S", "X"].includes(type)) continue;
                    shape += type;
                    previous = type;
                  }
                  return {
                    kind: /^\d{1,8}(?:,\s*\d{1,8};w=\d{1,6})*$/.test(v) ? "DOCUMENTED" : "OTHER",
                    lengthBand: v.length <= 32 ? "1-32" : v.length <= 64 ? "33-64" :
                      v.length <= 128 ? "65-128" : "129+",
                    shape: shape.slice(0, 96),
                    truncated: v.length > 96,
                  };
                }
                failureStage = "REPORT_BUILD";
                const report = {
                  status: "READONLY_PREFLIGHT_COMPLETE",
                  release: expected,
                  pm2: "online",
                  growth: settings || "NO_SETTINGS_RECORD",
                  flags,
                  queued: queued.map(x=>({
                    type: x.type, status: x.status, count: x._count._all,
                  })).sort((a,b)=>a.type.localeCompare(b.type)||a.status.localeCompare(b.status)),
                  pinterestAccounts: accounts.map(x=>({
                    state: x.connectionStatus, environment: x.apiEnvironment,
                    credentialsPresent: Boolean(x.encryptedCredentials),
                    accessTokenExpired: Boolean(x.accessTokenExpiresAt && x.accessTokenExpiresAt.getTime() < now),
                    refreshTokenExpired: Boolean(x.refreshTokenExpiresAt && x.refreshTokenExpiresAt.getTime() < now),
                    scopes: x.grantedScopes, lastApiCall: x.lastSuccessfulApiCallAt?.toISOString() || null,
                  })),
                  recentHeartbeat: heartbeat.map(x=>({
                    status: x.status, lastAt: x.heartbeatAt.toISOString(),
                  })),
                  lastReport: reports || null,
                  historicalQuota: quotaHistory.map(h => ({
                    observedAt: h.rateLimitObservedAt?.toISOString() || null,
                    limit: historicalHeaderEvidence(h.lastRateLimitLimit),
                    remainingKind: /^\d{1,8}$/.test(h.lastRateLimitRemaining || "") ? "INTEGER" :
                      h.lastRateLimitRemaining ? "OTHER" : "ABSENT",
                    resetKind: /^\d{1,8}$/.test(h.lastRateLimitReset || "") ? "INTEGER" :
                      h.lastRateLimitReset ? "OTHER" : "ABSENT",
                  })),
                  messagesSent: 0,
                  providerApiCalls: 0,
                  databaseWrites: 0,
                };
                failureStage = "REPORT_OUTPUT";
                console.log("SAYTWIST_GROWTH_PREFLIGHT_JSON_BEGIN");
                console.log(JSON.stringify(report, null, 2));
                console.log("SAYTWIST_GROWTH_PREFLIGHT_JSON_END");
              } finally {
                await db.$disconnect();
              }
            }

            main().catch(() => {
              console.error("PRODUCTION_GROWTH_PREFLIGHT_FAILED_STAGE: " + failureStage);
              process.exitCode = 1;
            });
            NODE
