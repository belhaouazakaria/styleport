name: SayTwist Approved Pin Batch One-Shot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  exact-owner-approved-batch:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.login == 'belhaouazakaria' &&
      github.event.comment.user.login == 'belhaouazakaria' &&
      startsWith(github.event.comment.body, 'RUN SAYTWIST APPROVED PIN BATCH ')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: production
    concurrency:
      group: saytwist-exact-three-approved-pins-20261106
      cancel-in-progress: false

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5

      - name: Verify exact owner and approved candidate authorization
        env:
          APPROVED_PIN_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/validate-growth-approved-pin-batch.mjs

      - name: Refuse advanced main and checksum the reviewed source
        id: verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          node --check scripts/validate-growth-approved-pin-batch.mjs
          test -s scripts/growth-approved-pin-exact-batch.ts
          echo "sha256=$(sha256sum scripts/growth-approved-pin-exact-batch.ts | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Prepare private exact-source runtime directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          script_stop: false
          command_timeout: 1m
          script: |
            set -eu
            test "$(id -un)" = "saytwist"
            APP=/home/saytwist/htdocs/saytwist.com
            ROOT="$APP/.growth-approved-pin-batch"
            DIR="$ROOT/${{ github.sha }}"
            test "$(cat "$APP/.deployed-release")" = "1f7f0560661a86947c3ce7c49c7a4669d41736f2"
            umask 077
            install -d -m 700 "$ROOT"
            test ! -e "$DIR"
            install -d -m 700 "$DIR"
            printf '%s\n' "${{ github.sha }}" > "$DIR/.source-sha"
            chmod 600 "$DIR/.source-sha"

      - name: Transfer only the reviewed one-shot publisher script
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          source: scripts/growth-approved-pin-exact-batch.ts
          target: /home/saytwist/htdocs/saytwist.com/.growth-approved-pin-batch/${{ github.sha }}
          overwrite: false

      - name: Verify due approvals and publish ONLY the exact three Pins
        uses: appleboy/ssh-action@v1.2.0
        env:
          APPROVED_PIN_SOURCE_SHA: ${{ github.sha }}
          APPROVED_PIN_RELEASE_SHA: 1f7f0560661a86947c3ce7c49c7a4669d41736f2
          APPROVED_PIN_SCRIPT_SHA256: ${{ steps.verified.outputs.sha256 }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          envs: APPROVED_PIN_SOURCE_SHA,APPROVED_PIN_RELEASE_SHA,APPROVED_PIN_SCRIPT_SHA256
          script_stop: false
          command_timeout: 5m
          script: |
            set -eu
            test "$(id -un)" = "saytwist"
            cd /home/saytwist/htdocs/saytwist.com
            test "$(cat .deployed-release)" = "$APPROVED_PIN_RELEASE_SHA"
            test "$(cat .growth-approved-pin-batch/$APPROVED_PIN_SOURCE_SHA/.source-sha)" = "$APPROVED_PIN_SOURCE_SHA"
            echo "$APPROVED_PIN_SCRIPT_SHA256  .growth-approved-pin-batch/$APPROVED_PIN_SOURCE_SHA/scripts/growth-approved-pin-exact-batch.ts" | sha256sum --check --status
            /home/saytwist/.nvm/versions/node/v24.20.0/bin/node <<'NODE'
            "use strict";
            const { spawnSync } = require("node:child_process");
            const { validatedDatabaseUrl } =
              require("./workers/growth-lease-watchdog-launch.cjs");
            const { loadPinterestRuntimeEnv } =
              require("./workers/growth-one-account-sync-launch.cjs");
            const APP = "/home/saytwist/htdocs/saytwist.com";
            const NODEDIR = "/home/saytwist/.nvm/versions/node/v24.20.0/bin";
            const NODE = NODEDIR + "/node";
            const PM2 = "/home/saytwist/.npm/_npx/5f7878ce38f1eb13/node_modules/pm2/bin/pm2";
            const source = process.env.APPROVED_PIN_SOURCE_SHA || "";
            const deployed = process.env.APPROVED_PIN_RELEASE_SHA || "";
            let stage = "HOST_PREFLIGHT";
            try {
              if (!/^[a-f0-9]{40}$/.test(source) ||
                  deployed !== "1f7f0560661a86947c3ce7c49c7a4669d41736f2" ||
                  process.cwd() !== APP) throw Error();
              const system = args => spawnSync("/usr/bin/systemctl", args,
                { encoding: "utf8", timeout: 5000, maxBuffer: 4096 });
              for (const timer of [
                "saytwist-growth-lease-watchdog.timer",
                "saytwist-growth-daily-observe.timer",
                "saytwist-growth-autonomous-cycle.timer",
              ]) if (system(["is-active", "--quiet", timer]).status !== 0) throw Error();
              const watchdog = "saytwist-growth-lease-watchdog.service";
              if (system(["show", "-P", "Result", watchdog]).stdout.trim() !== "success" ||
                  !system(["show", "-P", "Environment", watchdog]).stdout.includes(
                    "WATCHDOG_EXPECTED_RELEASE_SHA=" + deployed)) throw Error();

              const listing = spawnSync(PM2, ["jlist"], {
                encoding: "utf8", timeout: 10000, maxBuffer: 16 * 1024 * 1024,
                env: { ...process.env, PM2_HOME: "/home/saytwist/.pm2",
                  PATH: NODEDIR + ":/usr/local/bin:/usr/bin:/bin" },
              });
              if (listing.status !== 0 || listing.error) throw Error();
              const apps = JSON.parse(listing.stdout);
              const db = validatedDatabaseUrl(apps);
              const live = apps.find(app => app.name === "saytwist").pm2_env;
              const flag = name => live[name] ?? live.env?.[name];
              for (const name of [
                "GROWTH_WORKER_RUN_ENABLED",
                "GROWTH_DAILY_REPORT_SCHEDULE_ENABLED",
                "TELEGRAM_REPORTS_ENABLED",
                "GROWTH_ATTRIBUTION_COLLECTION_ENABLED",
              ]) if (flag(name) === "true") throw Error();
              if (["OBSERVE", "RECOMMEND"].includes(flag("GROWTH_ROLLOUT_MODE"))) throw Error();

              stage = "PUBLISH";
              const childEnv = {
                NODE_ENV: "production", HOME: "/home/saytwist",
                PATH: NODEDIR + ":/usr/local/bin:/usr/bin:/bin",
                DATABASE_URL: db,
                APPROVED_PIN_SOURCE_SHA: source,
                APPROVED_PIN_RELEASE_SHA: deployed,
                APPROVED_PIN_OWNER_AUTH: "RUN SAYTWIST APPROVED PIN BATCH " + source + ":" + deployed,
                APPROVED_PIN_ENTRYPOINT: "true",
                APP_BASE_URL: "https://saytwist.com",
                GROWTH_WORKER_RUN_ENABLED: "false",
                GROWTH_ROLLOUT_MODE: "OFF",
                GROWTH_AI_IMAGE_ENABLED: "false",
                GROWTH_ATTRIBUTION_COLLECTION_ENABLED: "false",
              };
              Object.assign(childEnv, loadPinterestRuntimeEnv(APP));
              const child = spawnSync(NODE, [
                "node_modules/tsx/dist/cli.mjs",
                ".growth-approved-pin-batch/" + source + "/scripts/growth-approved-pin-exact-batch.ts",
              ], {
                cwd: APP, encoding: "utf8", timeout: 240000,
                maxBuffer: 65536, env: childEnv,
              });
              const safe = (child.stdout || "").trim().split("\n")
                .filter(line => /^APPROVED_PIN_(PREFLIGHT|RECONCILED|BATCH|PUBLISHED_COUNT|GROWTH)=/.test(line));
              for (const line of safe) console.log(line.slice(0, 256));
              if (child.error || child.status !== 0 ||
                  !safe.includes("APPROVED_PIN_BATCH=PASSED") ||
                  !safe.includes("APPROVED_PIN_PUBLISHED_COUNT=3") ||
                  !safe.includes("APPROVED_PIN_GROWTH=OFF") ||
                  safe.filter(line => line.startsWith("APPROVED_PIN_RECONCILED=")).length !== 3) throw Error();
              console.log("APPROVED_PIN_ONE_SHOT=PASSED");
            } catch {
              console.error("APPROVED_PIN_ONE_SHOT=BLOCKED");
              console.error("APPROVED_PIN_FAILURE_STAGE=" + stage);
              process.exitCode = 1;
            }
            NODE
