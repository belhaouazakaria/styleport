name: SayTwist One Approved Pinterest Board Inventory Sync

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact deployed 40-character SHA
        required: true
        type: string
      confirmation:
        description: Type SYNC BOARD INVENTORY ONCE
        required: true
        type: string

permissions:
  contents: read

jobs:
  board-sync:
    if: >-
      github.actor == 'belhaouazakaria' &&
      github.ref == 'refs/heads/main'
    name: One Board Read Only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: saytwist-one-board-inventory-sync
      cancel-in-progress: false
    steps:
      - name: Verify explicit owner scope and trusted SHA
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
          BOARD_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          [[ "$BOARD_CONFIRMATION" == "SYNC BOARD INVENTORY ONCE" ]]
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RELEASE_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_ACTOR" == "belhaouazakaria" ]]

      - name: Checkout approved main
        uses: actions/checkout@v5

      - name: Refuse advanced main or missing trusted launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          test -f workers/growth-one-board-sync.ts
          test -f workers/growth-one-board-sync-launch.cjs
          node --check workers/growth-one-board-sync-launch.cjs
          test -f lib/growth/pinterest/board-one-get-guard.ts

      - name: Execute one owner-approved scoped board GET
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          envs: EXPECTED_RELEASE
          script_stop: false
          command_timeout: 3m
          script: |
            set -eu
            test "$(id -un)" = "saytwist"
            cd /home/saytwist/htdocs/saytwist.com
            GROWTH_ONE_BOARD_SYNC_LAUNCH=true \
              /home/saytwist/.nvm/versions/node/v24.20.0/bin/node \
              workers/growth-one-board-sync-launch.cjs
