name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_BASE_URL: https://translators.example.com
      NEXTAUTH_SECRET: test_nextauth_secret_please_replace
      NEXTAUTH_URL: https://translators.example.com
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/saytwist_ci
      OPENAI_API_KEY: test_key
      OPENAI_MODEL: gpt-4.1-mini
      NEXT_PUBLIC_APP_NAME: SayTwist
      IP_HASH_SECRET: test_ip_hash_secret_value_123456
      ALERT_ADMIN_EMAIL: alerts@example.com
      EMAIL_FROM: SayTwist Alerts <alerts@example.com>
      BREVO_API_KEY: test_brevo_key

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: npm

      - name: Verify Node and npm toolchain
        run: |
          node -e 'if (process.version !== "v20.20.2") process.exit(1)'
          npm --version | grep -Fx '10.8.2'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Validate production env contract
        run: npm run validate:env:production

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
