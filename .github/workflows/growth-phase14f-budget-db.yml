name: Phase 14F Pinterest budget PostgreSQL qualification

on:
  pull_request:
    paths:
      - "lib/growth/pinterest/global-budget.ts"
      - "lib/growth/pinterest/api.ts"
      - "lib/growth/pinterest/oauth.ts"
      - "lib/growth/operations/quota-probe.ts"
      - "tests/growth-pinterest-global-budget*"
      - "scripts/test-growth-pinterest-budget-db.sh"
      - ".github/workflows/growth-phase14f-budget-db.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-postgresql:
    name: Cross-process admission on disposable PostgreSQL 18
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: phase14f
          POSTGRES_PASSWORD: phase14f_ci_only
          POSTGRES_DB: saytwist_growth_phase14f_budget_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phase14f -d saytwist_growth_phase14f_budget_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      GROWTH_PINTEREST_BUDGET_TEST_DATABASE_URL: postgresql://phase14f:phase14f_ci_only@127.0.0.1:5432/saytwist_growth_phase14f_budget_test
      DATABASE_URL: postgresql://phase14f:phase14f_ci_only@127.0.0.1:5432/saytwist_growth_phase14f_budget_test
      APP_BASE_URL: https://translators.example.com
      NEXTAUTH_URL: https://translators.example.com
      NEXTAUTH_SECRET: test_nextauth_secret_please_replace
      OPENAI_API_KEY: test_key_never_call
      OPENAI_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - name: Run guarded disposable PostgreSQL admission and concurrency tests
        run: sh scripts/test-growth-pinterest-budget-db.sh
