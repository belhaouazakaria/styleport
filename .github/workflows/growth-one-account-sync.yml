name: SayTwist Phase14E One Pinterest Account Sync

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  one-account-sync:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.login == 'belhaouazakaria' &&
      github.event.comment.user.login == 'belhaouazakaria' &&
      startsWith(github.event.comment.body, 'RUN SAYTWIST GROWTH ONE ACCOUNT SYNC ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: saytwist-phase14e-one-account-sync
      cancel-in-progress: false
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v5

      - name: Authorize exact owner, issue and release SHA
        env:
          GROWTH_ONE_SYNC_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/validate-growth-one-account-sync-request.mjs

      - name: Reject advanced main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          test -f workers/growth-one-account-sync-launch.cjs
          test -f workers/growth-one-account-sync.ts

      - name: One approved bounded account metadata sync
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER || vars.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT }}
          envs: EXPECTED_RELEASE
          script_stop: true
          command_timeout: 3m
          script: |
            set -eu
            test "$(id -un)" = "saytwist"
            cd /home/saytwist/htdocs/saytwist.com
            GROWTH_ONE_ACCOUNT_SYNC_LAUNCH=true \
              /home/saytwist/.nvm/versions/node/v24.20.0/bin/node \
              workers/growth-one-account-sync-launch.cjs
